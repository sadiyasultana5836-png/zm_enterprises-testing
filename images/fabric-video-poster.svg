<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="60%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1B3E6E" />
      <stop offset="50%" stop-color="#142C4E" />
      <stop offset="100%" stop-color="#0A1628" />
    </radialGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EE" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C5A46D" />
      <stop offset="100%" stop-color="#8E6F3A" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CD5A8" />
      <stop offset="50%" stop-color="#167A62" />
      <stop offset="100%" stop-color="#0D4A3C" />
    </linearGradient>

    <linearGradient id="layer-shell" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#3A6BB0" />
      <stop offset="60%" stop-color="#234E8A" />
      <stop offset="100%" stop-color="#16315A" />
    </linearGradient>

    <linearGradient id="layer-canvas" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F2EDE2" />
      <stop offset="50%" stop-color="#DFD7C7" />
      <stop offset="100%" stop-color="#BFB49E" />
    </linearGradient>

    <linearGradient id="layer-felt" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#DCD4C4" />
      <stop offset="60%" stop-color="#BEB4A0" />
      <stop offset="100%" stop-color="#9A8E78" />
    </linearGradient>

    <linearGradient id="layer-lining" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#1E9B7D" />
      <stop offset="50%" stop-color="#167A62" />
      <stop offset="100%" stop-color="#0B4235" />
    </linearGradient>

    <!-- Woven Twill Pattern Simulation -->
    <pattern id="twill-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0 L16 16 M-4 12 L4 20 M12 -4 L20 4" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.12" />
      <path d="M16 0 L0 16 M20 12 L12 20 M4 -4 L-4 4" stroke="#000000" stroke-width="1.2" stroke-opacity="0.18" />
    </pattern>

    <!-- Canvas Mesh Pattern -->
    <pattern id="canvas-pattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="12" y2="6" stroke="#8A7E68" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2,2" />
      <line x1="6" y1="0" x2="6" y2="12" stroke="#8A7E68" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2,2" />
    </pattern>

    <!-- Drop Shadow Filters -->
    <filter id="layer-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-10" dy="25" stdDeviation="18" flood-color="#030810" flood-opacity="0.55" />
    </filter>

    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Atelier Studio Background -->
  <rect width="1920" height="1080" fill="url(#bg-glow)" />

  <!-- Subtle Studio Grid & Weave Watermark in Background -->
  <g opacity="0.04" stroke="#FAF8F2" stroke-width="1">
    <line x1="0" y1="180" x2="1920" y2="180" />
    <line x1="0" y1="360" x2="1920" y2="360" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="900" x2="1920" y2="900" />
    <line x1="320" y1="0" x2="320" y2="1080" />
    <line x1="640" y1="0" x2="640" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1280" y1="0" x2="1280" y2="1080" />
    <line x1="1600" y1="0" x2="1600" y2="1080" />
  </g>

  <!-- Diagonal Studio Light Beam -->
  <polygon points="650,0 1350,0 1850,1080 1150,1080" fill="#234E8A" opacity="0.14" />
  <polygon points="800,0 1200,0 1600,1080 1200,1080" fill="#FAF8F2" opacity="0.04" />

  <!-- 3D Exploded Isometric Fabric Layers (Hero Artwork Right Half) -->
  <g transform="translate(1120, 520) scale(1.15)">
    <!-- Layer 4: Viscose-Satin Inner Lining (Bottom Layer, Offset down-right) -->
    <g transform="translate(120, 160)" filter="url(#layer-shadow)">
      <polygon points="0,-120 280,-20 0,80 -280,-20" fill="url(#layer-lining)" />
      <!-- Layer Edge Depth -->
      <polygon points="-280,-20 0,80 0,92 -280,-8" fill="#0A362B" />
      <polygon points="0,80 280,-20 280,-8 0,92" fill="#082C23" />
      <!-- Shimmer Highlight -->
      <line x1="-260" y1="-20" x2="-20" y2="65" stroke="#48DFB6" stroke-width="2" stroke-opacity="0.4" />
      <!-- Label Pin -->
      <circle cx="200" cy="30" r="5" fill="#D4AF37" filter="url(#glow-gold)" />
      <line x1="200" y1="30" x2="270" y2="60" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="280" y="65" fill="#FAF8F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Layer 4: Viscose-Satin Lining</text>
      <text x="280" y="82" fill="#A0A8B4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Frictionless interior glide</text>
    </g>

    <!-- Layer 3: Chest Felt & Horsehair Canvas Pad -->
    <g transform="translate(40, 60)" filter="url(#layer-shadow)">
      <polygon points="0,-120 280,-20 0,80 -280,-20" fill="url(#layer-felt)" />
      <polygon points="0,-120 280,-20 0,80 -280,-20" fill="url(#canvas-pattern)" />
      <!-- Layer Edge Depth -->
      <polygon points="-280,-20 0,80 0,96 -280,-4" fill="#807560" />
      <polygon points="0,80 280,-20 280,-4 0,96" fill="#6A604D" />
      <!-- Label Pin -->
      <circle cx="210" cy="-30" r="5" fill="#D4AF37" filter="url(#glow-gold)" />
      <line x1="210" y1="-30" x2="280" y2="-5" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="290" y="-1" fill="#FAF8F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Layer 3: Chest Felt &amp; Horsehair Canvas</text>
      <text x="290" y="16" fill="#A0A8B4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">3D chest contour &amp; bounce memory</text>
    </g>

    <!-- Layer 2: Fused Canvas Interfacing -->
    <g transform="translate(-40, -40)" filter="url(#layer-shadow)">
      <polygon points="0,-120 280,-20 0,80 -280,-20" fill="url(#layer-canvas)" />
      <polygon points="0,-120 280,-20 0,80 -280,-20" fill="url(#canvas-pattern)" />
      <!-- Layer Edge Depth -->
      <polygon points="-280,-20 0,80 0,88 -280,-12" fill="#A49983" />
      <polygon points="0,80 280,-20 280,-12 0,88" fill="#8E836F" />
      <!-- Label Pin -->
      <circle cx="-190" cy="10" r="5" fill="#D4AF37" filter="url(#glow-gold)" />
      <line x1="-190" y1="10" x2="-260" y2="40" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="-270" y="45" text-anchor="end" fill="#FAF8F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Layer 2: Fused Interfacing</text>
      <text x="-270" y="62" text-anchor="end" fill="#A0A8B4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Lapel &amp; collar structural stability</text>
    </g>

    <!-- Layer 1: Outer Shell Suiting Fabric (Top Layer) -->
    <g transform="translate(-120, -140)" filter="url(#layer-shadow)">
      <polygon points="0,-120 280,-20 0,80 -280,-20" fill="url(#layer-shell)" />
      <polygon points="0,-120 280,-20 0,80 -280,-20" fill="url(#twill-pattern)" />
      <!-- Layer Edge Depth -->
      <polygon points="-280,-20 0,80 0,90 -280,-10" fill="#132B4F" />
      <polygon points="0,80 280,-20 280,-10 0,90" fill="#0E1F38" />
      <!-- Gold Border Crest Line -->
      <polygon points="0,-115 270,-20 0,75 -270,-20" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.6" />
      <!-- Label Pin -->
      <circle cx="-170" cy="-60" r="5" fill="#D4AF37" filter="url(#glow-gold)" />
      <line x1="-170" y1="-60" x2="-240" y2="-90" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="-250" y="-85" text-anchor="end" fill="#FAF8F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Layer 1: 260 GSM Outer Suiting</text>
      <text x="-250" y="-68" text-anchor="end" fill="#A0A8B4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Italian poly-viscose worsted twill</text>
    </g>

    <!-- Exploded Z-Axis Guide Lines -->
    <line x1="-120" y1="-60" x2="120" y2="240" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,6" />
  </g>

  <!-- Left Cinematic Typography & Branding -->
  <g transform="translate(140, 240)">
    <!-- Pill Badge -->
    <g>
      <rect x="0" y="0" width="360" height="38" rx="19" fill="#1B3E6E" stroke="url(#gold-grad)" stroke-width="1.2" opacity="0.9" />
      <circle cx="22" cy="19" r="6" fill="#167A62" />
      <text x="38" y="24" fill="#FAF8F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">CINEMATIC TEXTILE EXPLORATION</text>
    </g>

    <!-- Main Title Group -->
    <text x="0" y="110" fill="#FAF8F2" font-family="'Playfair Display', Georgia, serif" font-size="58" font-weight="800" line-height="1.15">
      Discover the Fabric
    </text>
    <text x="0" y="180" fill="url(#gold-grad)" font-family="'Playfair Display', Georgia, serif" font-size="58" font-weight="800">
      Beneath the Surface
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" fill="#D2D6DC" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="400" width="600">
      <tspan x="0" dy="0">Explore the construction, texture, and craftsmanship</tspan>
      <tspan x="0" dy="32">behind fabric and garment materials layer by layer.</tspan>
    </text>

    <!-- Scene Sequence Indicator Bar -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="560" height="90" rx="12" fill="#0F223D" stroke="#234E8A" stroke-width="1.5" />
      
      <!-- Scene 1 -->
      <g transform="translate(24, 20)">
        <text x="0" y="0" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">SCENE 1</text>
        <text x="0" y="20" fill="#FAF8F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">The Hero Shot</text>
        <text x="0" y="38" fill="#8CA8D1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Macro Close-Up</text>
      </g>
      <line x1="130" y1="20" x2="130" y2="70" stroke="#234E8A" stroke-width="1" />

      <!-- Scene 2 -->
      <g transform="translate(145, 20)">
        <text x="0" y="0" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">SCENE 2</text>
        <text x="0" y="20" fill="#FAF8F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Weave Anatomy</text>
        <text x="0" y="38" fill="#8CA8D1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Warp &amp; Weft Yarns</text>
      </g>
      <line x1="265" y1="20" x2="265" y2="70" stroke="#234E8A" stroke-width="1" />

      <!-- Scene 3 -->
      <g transform="translate(280, 20)">
        <text x="0" y="0" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">SCENE 3</text>
        <text x="0" y="20" fill="#FAF8F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Exploded Layers</text>
        <text x="0" y="38" fill="#8CA8D1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Physical Anatomy</text>
      </g>
      <line x1="410" y1="20" x2="410" y2="70" stroke="#234E8A" stroke-width="1" />

      <!-- Scene 4 & 5 -->
      <g transform="translate(425, 20)">
        <text x="0" y="0" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">SCENE 4 &amp; 5</text>
        <text x="0" y="20" fill="#FAF8F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Specs &amp; Assembly</text>
        <text x="0" y="38" fill="#8CA8D1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Garment Handover</text>
      </g>
    </g>

    <!-- Trust Hallmark -->
    <g transform="translate(0, 480)">
      <circle cx="16" cy="16" r="14" fill="#167A62" />
      <path d="M10 16 L14 20 L22 12" fill="none" stroke="#FAF8F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="40" y="14" fill="#FAF8F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Certified Indian Mill Direct Fabrics</text>
      <text x="40" y="30" fill="#A0A8B4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Zero fake claims • Verified GSM &amp; composition specs</text>
    </g>
  </g>

  <!-- Big Central Play Action Button (Poster Call to Play) -->
  <g transform="translate(960, 540)">
    <!-- Ambient Pulse Ring -->
    <circle cx="0" cy="0" r="76" fill="#D4AF37" opacity="0.18" />
    <circle cx="0" cy="0" r="62" fill="#1B3E6E" stroke="url(#gold-grad)" stroke-width="3" filter="url(#glow-gold)" />
    <!-- Play Triangle -->
    <polygon points="-12,-22 22,0 -12,22" fill="#FAF8F2" />
  </g>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(140, 990)">
    <text x="0" y="0" fill="#8CA8D1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" letter-spacing="2" font-weight="600">
      ZM ENTERPRISES ATELIER • HYDERABAD, TELANGANA
    </text>
  </g>
</svg>
